name: Generate 3D graph and snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Recolor 3D graph to lime
        run: |
          node -e '
          const fs = require("fs");
          const dir = "profile-3d-contrib";
          for (const f of fs.readdirSync(dir)) {
            if (!f.endsWith(".svg")) continue;
            const p = dir + "/" + f;
            let s = fs.readFileSync(p, "utf8");
            s = s.replace(/rgb\((\d+), (\d+), (\d+)\)/g, (m, r, g, b) => {
              r = +r; g = +g; b = +b;
              return (g > r + 20 && g > b + 20) ? `rgb(${Math.round(g * .82)}, ${g}, ${Math.round(g * .09)})` : m;
            });
            s = s.replace(/#00000f/gi, "#0e0e10").replace(/#47a042/gi, "#d1fe17");
            fs.writeFileSync(p, s);
          }'

      - name: Commit 3D graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Update 3D contribution graph"
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23D1FE17&color_dots=%23222227,%234a5a00,%238aab00,%23b8e000,%23d1fe17

      - uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
