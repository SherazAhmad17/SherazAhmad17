name: Update latest repos

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build repo list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          gh api "users/$USER_NAME/repos?sort=pushed&per_page=30&type=owner" \
            --jq '[.[] | select(.fork == false and .name != "'"$USER_NAME"'")][:6][]
                  | "- [\(.name)](\(.html_url)) - \(.description // "No description") (\(.language // "n/a"))"' \
            > repos.md
          python3 - <<'PY'
          import re
          readme = open("README.md", encoding="utf-8").read()
          repos = open("repos.md", encoding="utf-8").read().strip()
          new = "<!-- REPOS:START -->\n" + repos + "\n<!-- REPOS:END -->"
          readme = re.sub(r"<!-- REPOS:START -->.*?<!-- REPOS:END -->", new, readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(readme)
          PY
          rm repos.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update latest repos" && git push
