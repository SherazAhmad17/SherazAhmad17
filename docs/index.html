:root{--event-blue:#006aff;--event-green:#00ab44;--event-orange:#f26d00;--event-purple:#924ff7}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0c;color:#fff;font-family:"Inter Medium",Inter,system-ui,sans-serif;font-weight:500}
.page{max-width:1152px;margin:0 auto;padding:32px 20px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- banner (layout mirrors .devday-banner) ---------- */
.devday-banner{position:relative;overflow:hidden;border-radius:12px;background:#000;padding:40px;text-align:left}
.devday-copy{width:75%;position:relative;z-index:10}
.devday-title{display:block;width:100%;position:relative}
.devday-title svg.dd{display:block;width:100%;height:auto;overflow:visible}
.devday-copy p{margin:20px 0 0;max-width:560px;color:#d4d4d4;font-size:17px;line-height:1.5}
.devday-actions{display:flex;align-items:center;gap:20px;margin-top:28px}
.devday-character{position:absolute;z-index:20;width:26%;bottom:16px;right:.75%;transform:translateY(10%)}
.devday-button-frame{position:relative;display:inline-flex}
.devday-button{position:relative;z-index:10;display:inline-flex;min-height:44px;align-items:center;gap:8px;background:#fff;color:#000;padding:12px 20px;font:inherit;font-size:14px;text-decoration:none;
  border-radius:999px;transition:border-radius .18s .18s}
.devday-button:hover,.devday-button:focus-visible{border-radius:0;transition-delay:0s}
.devday-dot{z-index:20;opacity:0;pointer-events:none;border-radius:50%;width:9px;height:9px;transition:opacity .18s,transform .18s;position:absolute;transform:scale(.35)}
.devday-dot-tl{--dot-delay:0s;background:#006aff;top:-4.5px;left:-4.5px}
.devday-dot-tr{--dot-delay:35ms;background:#00ab44;top:-4.5px;right:-4.5px}
.devday-dot-br{--dot-delay:70ms;background:#f26d00;bottom:-4.5px;right:-4.5px}
.devday-dot-bl{--dot-delay:.105s;background:#924ff7;bottom:-4.5px;left:-4.5px}
.devday-button-frame:hover .devday-dot,.devday-button-frame:has(:focus-visible) .devday-dot{opacity:1;transition-delay:calc(.18s + var(--dot-delay));transform:scale(1)}
.devday-link{color:#fff;font-size:14px;text-underline-offset:4px}
@media (max-width:639px){
  .devday-banner{padding:24px}
  .devday-copy{width:100%}
  .devday-character{width:130px;top:auto;bottom:16px;right:4px}
}

/* ---------- agent bot (copied from the reference stylesheet) ---------- */
.agent{aspect-ratio:190/166;width:100%;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:0 0;border:0;border-radius:16px;padding:0;display:block;position:relative;container-type:inline-size}
.agent:focus-visible{outline-offset:-10px;outline:2px solid #fff}
.agent[data-agent-phase=pending]{visibility:hidden}
.actor,.head,.gaze,.cursor,.eyes,.expressions{position:absolute;inset:0}
.actor{transform-origin:47.3684% 49.3976%}
.head{transform-origin:47.3684% 49.3976%;transform:rotate(-12deg)}
.face{aspect-ratio:1;border-radius:50%;width:52.6316%;position:absolute;top:19.2771%;left:21.0526%;overflow:hidden}
.eyes img{width:100%;height:100%;position:absolute;inset:0}
.cursor{transition:transform .16s ease-out}
.expression{letter-spacing:-.9684cqw;white-space:nowrap;user-select:none;justify-content:center;align-items:center;height:32.5301%;font-size:24.2105cqw;font-weight:500;line-height:1.1;display:flex;position:absolute}
.agent[data-agent-phase=out] .actor{animation:.65s cubic-bezier(.5,0,.80955,.20652) both roll-out-scale}
.agent[data-agent-phase=out] .eyes{animation:.65s cubic-bezier(.33,0,.67,.33) both roll-out-eyes}
.agent[data-agent-phase=out] .expressions{animation:.28s step-end both accessories-out}
.agent[data-agent-phase=in] .actor{animation:1.05s cubic-bezier(.29256,.93431,.53909,1) both roll-in-scale}
.agent[data-agent-phase=in] .eyes{animation:1.05s cubic-bezier(.5,1,.5,1) both roll-in-eyes}
.agent[data-agent-phase=in] .gaze{animation:1.05s cubic-bezier(.5,1,.5,1) both roll-in-gaze}
.agent[data-agent-phase=in] .expressions{animation:.42s step-end both accessories-in}
@keyframes roll-out-scale{0%{transform:scale(1)}98%{visibility:visible}to{visibility:hidden;transform:scale(.22)}}
@keyframes roll-in-scale{0%{transform:scale(.22)}75%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes roll-out-eyes{0%{transform:translateY(0)}to{transform:translateY(-100%)}}
@keyframes roll-in-eyes{0%{transform:translateY(0)}to{transform:translateY(-100%)}}
@keyframes roll-in-gaze{0%{transform:translateY(38%)}to{transform:translateY(0)}}
@keyframes accessories-out{0%{visibility:visible}to{visibility:hidden}}
@keyframes accessories-in{0%{visibility:hidden}to{visibility:visible}}
@media (prefers-reduced-motion:no-preference){
  .agent[data-agent-phase=nod] .actor{animation:2s cubic-bezier(.65,0,.35,1) both nod-body}
  .agent[data-agent-phase=nod] .gaze{animation:2s cubic-bezier(.65,0,.35,1) both nod-gaze}
}
@keyframes nod-body{0%,10%,35%,64%,to{transform:translateY(0)}23%{transform:translateY(3.012%)}49%{transform:translateY(1.8072%)}}
@keyframes nod-gaze{0%,10%,35%,64%,to{transform:translateY(0)}23%,49%{transform:translateY(7%)}}
@media (prefers-reduced-motion:reduce){
  .cursor{transition:none}
  .agent[data-agent-phase] .actor,.agent[data-agent-phase] .eyes,.agent[data-agent-phase] .gaze,.agent[data-agent-phase] .expressions{animation:none}
}

/* ---------- draw-dots text (copied from the reference stylesheet) ---------- */
.dd-wrap{--draw-dots-hover-release-delay:.5s;--draw-dots-hover-fill-duration:1ms;--draw-dots-hover-dot-duration:1ms;--draw-dots-point-pop-duration:90ms;display:block;position:relative;color:#fff}
.dd .fill{fill:var(--draw-dots-text-color,currentColor);opacity:1}
.dd .stroke{fill:none;opacity:0;stroke:var(--draw-dots-outline-color,currentColor);stroke-linejoin:round;stroke-width:var(--draw-dots-stroke-width,2.2)}
.dd .anchor{stroke:none;fill:var(--draw-dots-dot-color,currentColor)}
.dd .a-anim,.dd .hover{opacity:0}
.dd .hit{fill:#0000;pointer-events:all;stroke:#0000;touch-action:pan-y}
.dd-wrap[data-animation-paused=true] .stroke,.dd-wrap[data-animation-paused=true] .fill,.dd-wrap[data-animation-paused=true] .a-anim{animation-play-state:paused!important}
.dd-wrap[data-animate=true]:not([data-animation-complete=true]) .stroke{opacity:0;animation:.28s step-end forwards dd-outline}
.dd-wrap[data-animate=true]:not([data-animation-complete=true]) .fill{opacity:0;animation:1ms linear forwards dd-show}
.dd-wrap[data-animate=true]:not([data-animation-complete=true]) .a-anim{animation-delay:var(--draw-dots-point-delay,0s)}
.dd-wrap[data-animate=true]:not([data-animation-complete=true]) .a-large{animation-name:dd-large;animation-duration:var(--draw-dots-point-sequence-duration);animation-timing-function:linear;animation-fill-mode:forwards}
.dd-wrap[data-animate=true]:not([data-animation-complete=true]) .a-small{animation-name:dd-small;animation-duration:var(--draw-dots-point-sequence-duration);animation-timing-function:linear;animation-fill-mode:forwards}
.dd-wrap[data-animate-on-hover=true] .fill,.dd-wrap[data-animate-on-hover=true] .stroke{transition:opacity var(--draw-dots-hover-fill-duration) step-end var(--draw-dots-hover-release-delay)}
.dd-wrap[data-animate-on-hover=true] .hover{transition:opacity var(--draw-dots-hover-dot-duration) step-end calc(var(--draw-dots-hover-release-delay) + var(--draw-dots-hover-fill-duration) + var(--draw-dots-point-delay,0s))}
.dd-wrap[data-animate-on-hover=true] .letter[data-hover-state=playing] .stroke,.dd-wrap[data-animate-on-hover=true] .letter[data-hover-state=active] .stroke{opacity:1;transition-delay:0s;animation:none}
.dd-wrap[data-animate-on-hover=true] .letter[data-hover-state=playing] .fill,.dd-wrap[data-animate-on-hover=true] .letter[data-hover-state=active] .fill{opacity:0;transition-delay:0s;animation:none}

const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ======================= entrance sync (title + bot start together) ======================= */
const entrance = { waiting: new Map(), started: false };
function joinEntrance(name, start) {
  entrance.waiting.set(name, start);
  if (entrance.started) return start();
  if (entrance.waiting.size === 2) requestAnimationFrame(() => {
    entrance.started = true;
    entrance.waiting.forEach(fn => fn());
  });
}

/* ======================= AGENT BOT ======================= */
const MODES = {
  building:  { color: "#00ab44", expressions: [{ text: "</>", x: 78,  y: -29, width: 66 }] },
  designing: { color: "#924ff7", expressions: [{ text: "!",   x: -24, y: -4,  width: 13 }] },
  iterating: { color: "#006aff", expressions: [{ text: ",", x: -10, y: -16, width: 12, flip: true }, { text: ",", x: 62, y: 69, width: 12 }] },
  testing:   { color: "#f26d00", expressions: [{ text: "<3", x: 93, y: 53, width: 54 }] },
  shipping:  { color: "#dfdfdf", expressions: [{ text: "<3", x: 89, y: -14, width: 50 }] },
  thinking:  { color: "#262626", expressions: [{ text: "?",  x: -26, y: -7,  width: 23 }] }
};
const ORDER = ["thinking", "designing", "building", "iterating", "testing", "shipping"];
const nextMode = m => ORDER[(ORDER.indexOf(m) + 1) % ORDER.length];
const eyesSrc = m => "data:image/svg+xml;utf8," + encodeURIComponent(EYES[m]);

function createAgent(host, label) {
  const state = { mode: Math.random() < .5 ? "building" : "designing", phase: "pending" };
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "agent"; btn.setAttribute("aria-label", label);
  btn.innerHTML = '<div class="actor" aria-hidden="true"><div class="head"><div class="face"><div class="gaze"><div class="cursor"><div class="eyes"></div></div></div></div></div><div class="expressions"></div></div>';
  host.appendChild(btn);
  const actor = btn.querySelector(".actor"), face = btn.querySelector(".face"), cursor = btn.querySelector(".cursor"),
        eyes = btn.querySelector(".eyes"), expr = btn.querySelector(".expressions");
  let raf = 0;

  function render() {
    const m = MODES[state.mode];
    btn.dataset.agentMode = state.mode; btn.dataset.agentPhase = state.phase;
    btn.setAttribute("aria-disabled", String(state.phase !== "idle" && state.phase !== "nod"));
    face.style.backgroundColor = m.color;
    eyes.replaceChildren(...[0, ...(state.phase === "in" ? [1] : [])].map(i => {
      const img = new Image(100, 100); img.src = eyesSrc(state.mode); img.alt = ""; img.draggable = false; img.style.top = i * 100 + "%"; return img;
    }));
    expr.style.color = state.mode === "thinking" ? "#fff" : m.color;
    expr.replaceChildren(...m.expressions.map(e => {
      const s = document.createElement("span"); s.className = "expression"; s.textContent = e.text;
      Object.assign(s.style, { left: (e.x + 40) / 190 * 100 + "%", top: (e.y + 32) / 166 * 100 + "%", width: e.width / 190 * 100 + "%", transform: e.flip ? "scaleX(-1)" : "" });
      return s;
    }));
    cursor.style.transform = "translate(0, 0)";   // reset gaze whenever mode/phase changes
  }
  function set(next) { Object.assign(state, next); render(); }

  // phase machine: in/out/nod animations end on the actor
  actor.addEventListener("animationend", e => {
    if (e.target !== actor) return;
    if (state.phase === "out") set({ mode: nextMode(state.mode), phase: "in" });
    else if (state.phase === "in" || state.phase === "nod") set({ phase: "idle" });
  });
  btn.addEventListener("click", () => {
    if (state.phase !== "idle" && state.phase !== "nod") return;
    reduceMotion() ? set({ mode: nextMode(state.mode), phase: "idle" }) : set({ phase: "out" });
  });
  // nod when the CTA button is hovered / focused
  const cta = host.closest("[data-devday-banner]").querySelector(".devday-button");
  const nod = e => { if ((e instanceof PointerEvent && e.pointerType === "touch") || reduceMotion()) return; if (state.phase === "idle") set({ phase: "nod" }); };
  cta.addEventListener("pointerenter", nod); cta.addEventListener("focus", nod);

  // THE MOUSE TRACKING (same maths as the reference)
  addEventListener("pointermove", ev => {
    if ((state.phase !== "idle" && state.phase !== "nod") || reduceMotion() || ev.pointerType === "touch") return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const r = face.getBoundingClientRect();
      const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
      const a = 12 * Math.PI / 180;
      const x = dx * Math.cos(a) - dy * Math.sin(a), y = dx * Math.sin(a) + dy * Math.cos(a);
      const d = Math.hypot(x, y), k = Math.min(12, d / 12);
      cursor.style.transform = `translate(${d ? x / d * k : 0}%, ${d ? y / d * k : 0}%)`;
    });
  }, { passive: true });
  const reset = () => { cancelAnimationFrame(raf); cursor.style.transform = "translate(0, 0)"; };
  addEventListener("blur", reset); document.documentElement.addEventListener("pointerleave", reset);

  render();
  joinEntrance("agent", () => set({ phase: reduceMotion() ? "idle" : "in" }));
  return { set, state };
}

/* ======================= DRAW-DOTS TITLE ======================= */
function b64ToBuf(b) { const s = atob(b), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const fmt = n => Number(n.toFixed(2));

function pathDataOf(cmds) {
  const o = []; let open = false;
  for (const c of cmds) {
    if (c.type === "M") { if (open) o.push("Z"); o.push(`M${fmt(c.x)} ${fmt(c.y)}`); open = true; }
    else if (c.type === "L") o.push(`L${fmt(c.x)} ${fmt(c.y)}`);
    else if (c.type === "Q") o.push(`Q${fmt(c.x1)} ${fmt(c.y1)} ${fmt(c.x)} ${fmt(c.y)}`);
    else if (c.type === "C") o.push(`C${fmt(c.x1)} ${fmt(c.y1)} ${fmt(c.x2)} ${fmt(c.y2)} ${fmt(c.x)} ${fmt(c.y)}`);
    else if (c.type === "Z") { if (open) o.push("Z"); open = false; }
  }
  if (open) o.push("Z");
  return o.join("");
}
// anchor points = path vertices, skipping ones closer than `min` to the previous kept one
function anchorPoints(cmds, min) {
  const pts = []; let prev = null;
  for (const c of cmds) {
    if (c.type === "M") prev = null;
    if ("x" in c && "y" in c) {
      if (prev && Math.hypot(prev.x - c.x, prev.y - c.y) < min) continue;
      prev = { x: c.x, y: c.y }; pts.push(prev);
    }
  }
  return pts;
}

function createDrawDots(host, font, opts) {
  const FS = 100, K = Math.max(0, 1100 - opts.letterOverlap), SEQ = K <= 0 ? 1100 : Math.min(1100, K * 6);
  const STEP = 35, STROKE_DELAY = 160, FILL_DELAY = 440, STROKE_DUR = 280, POP = 90;
  const text = opts.text, chars = Array.from(text);
  const adv = c => font.getAdvanceWidth(c, FS, { kerning: true, features: { liga: false } });
  const asc = font.ascender * FS / font.unitsPerEm;
  let x = 0; const letters = []; let idx = 0, ptOffset = 0;
  const words = []; { let w = 0; chars.forEach((c, i) => { if (c.trim() === "") { if (i > w) words.push([w, i]); w = i + 1; } }); if (chars.length > w) words.push([w, chars.length]); }
  chars.forEach((c, i) => {
    if (c.trim() !== "") {
      const p = font.getPath(c, x, asc, FS), b = p.getBoundingBox(), pts = anchorPoints(p.commands, FS * 0.125);
      letters.push({ ch: c, ci: i, idx: idx++, pathData: pathDataOf(p.commands), b, pts, off: ptOffset });
      ptOffset += pts.length;
    }
    x += adv(c) + (i < chars.length - 1 ? font.getKerningValue(font.charToGlyph(c), font.charToGlyph(chars[i + 1])) * FS / font.unitsPerEm : 0);
  });
  const bb = letters.reduce((a, l) => ({ x1: Math.min(a.x1, l.b.x1), y1: Math.min(a.y1, l.b.y1), x2: Math.max(a.x2, l.b.x2), y2: Math.max(a.y2, l.b.y2) }), letters[0].b);
  const pad = 16, vb = { x: bb.x1 - pad, y: bb.y1 - pad, w: bb.x2 - bb.x1 + pad * 2, h: bb.y2 - bb.y1 + pad * 2 };
  const rLarge = FS * .047 * 1.15, rSmall = FS * .047 * .7, hitPad = FS * .08;

  const wrap = document.createElement("span");
  wrap.className = "dd-wrap";
  Object.assign(wrap.dataset, { animate: "true", animationPaused: "true", animateOnHover: "true" });
  wrap.style.setProperty("--draw-dots-point-sequence-duration", SEQ + "ms");
  const svg = el("svg", { class: "dd", viewBox: `${vb.x} ${vb.y} ${vb.w} ${vb.h}`, "aria-hidden": "true" }, wrap);
  svg.style.setProperty("--draw-dots-stroke-width", FS * .0215);
  const defs = el("defs", {}, svg);

  const rules = opts.colorRules || [];
  const state = {}; const timers = {};
  const word = ci => words.findIndex(w => ci >= w[0] && ci < w[1]);

  letters.forEach(l => {
    const cp = el("clipPath", { id: "dd-clip-" + l.idx }, defs); el("path", { d: l.pathData }, cp);
    const g = el("g", { class: "letter" }, svg);
    const rule = rules.find(r => r.test(l.ci, word(l.ci)));
    if (rule) { g.style.setProperty("--draw-dots-dot-color", rule.color); g.style.setProperty("--draw-dots-outline-color", rule.color); g.style.setProperty("--draw-dots-text-color", rule.color); }
    const stroke = el("path", { class: "stroke", d: l.pathData, "clip-path": `url(#dd-clip-${l.idx})` }, g); stroke.style.animationDelay = l.idx * K + STROKE_DELAY + "ms";
    const fill = el("path", { class: "fill", d: l.pathData }, g); fill.style.animationDelay = l.idx * K + FILL_DELAY + "ms";
    l.pts.forEach((p, n) => {
      const introDelay = l.idx * K + n * STEP + "ms", hoverDelay = n * STEP + "ms";
      [["a-anim a-large", rLarge, introDelay], ["a-anim a-small", rSmall, introDelay], ["hover hover-large", rLarge, hoverDelay], ["hover hover-small", rSmall, hoverDelay]].forEach(([cls, r, d]) => {
        const c = el("circle", { class: "anchor " + cls, cx: p.x, cy: p.y, r }, g); c.style.setProperty("--draw-dots-point-delay", d);
      });
    });
    l.g = g; l.hit = { x1: l.b.x1 - hitPad, y1: l.b.y1 - hitPad, x2: l.b.x2 + hitPad, y2: l.b.y2 + hitPad };
    l.rect = el("rect", { class: "hit", x: l.hit.x1, y: l.hit.y1, width: l.hit.x2 - l.hit.x1, height: l.hit.y2 - l.hit.y1 }, g);
    state[l.idx] = { phase: "idle", hovered: false };
  });
  host.appendChild(wrap);

  // ---- hover state machine (same phases/timings as the reference: idle → playing → active → releasing → idle)
  const playMs = n => Math.max(0, n - 1) * STEP + 1 + 90, releaseMs = n => 501 + playMs(n);
  const setPhase = (l, phase, hovered) => { state[l.idx] = { phase, hovered }; if (phase === "idle") l.g.removeAttribute("data-hover-state"); else l.g.setAttribute("data-hover-state", phase); };
  const clear = l => { clearTimeout(timers[l.idx]); delete timers[l.idx]; };
  function release(l) { clear(l); setPhase(l, "releasing", false); timers[l.idx] = setTimeout(() => { clear(l); setPhase(l, "idle", false); }, releaseMs(l.pts.length)); }
  function enter(l) {
    const s = state[l.idx]; state[l.idx] = { ...s, hovered: true };
    if (s.phase !== "idle") return;
    clear(l); setPhase(l, "playing", true);
    timers[l.idx] = setTimeout(() => { clear(l); const t = state[l.idx]; if (t.phase === "playing") t.hovered ? setPhase(l, "active", true) : release(l); }, playMs(l.pts.length));
  }
  function leave(l) { const s = state[l.idx]; state[l.idx] = { ...s, hovered: false }; if (s.phase === "active") release(l); }
  const wireHover = () => {
    letters.forEach(l => { l.g.addEventListener("pointerenter", e => { if (e.pointerType !== "touch") enter(l); }); l.g.addEventListener("pointerleave", () => leave(l)); });
    // touch: drag across letters
    let current = null, pid = null;
    const hit = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      for (let i = letters.length - 1; i >= 0; i--) { const h = letters[i].hit; if (p.x >= h.x1 && p.x <= h.x2 && p.y >= h.y1 && p.y <= h.y2) return letters[i]; } return null; };
    const move = l => { if ((current && current.idx) === (l && l.idx)) return; if (current) leave(current); current = l; if (l) enter(l); };
    svg.addEventListener("pointerdown", e => { if (e.pointerType === "touch" || e.pointerType === "pen") { pid = e.pointerId; svg.setPointerCapture(pid); e.preventDefault(); move(hit(e)); } });
    svg.addEventListener("pointermove", e => { if (pid === e.pointerId) { e.preventDefault(); move(hit(e)); } });
    const up = e => { if (pid === e.pointerId) { svg.releasePointerCapture(pid); pid = null; move(null); } };
    svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  };

  const total = letters.reduce((m, l) => Math.max(m, l.idx * K + STROKE_DELAY + STROKE_DUR, l.idx * K + Math.max(0, l.pts.length - 1) * STEP + SEQ), 0) + 50;
  const finish = () => { wrap.dataset.animationComplete = "true"; wireHover(); };
  joinEntrance("title", () => {
    if (reduceMotion()) return finish();
    delete wrap.dataset.animationPaused;
    setTimeout(finish, total);
  });
  return { wrap, letters, enter, leave };
}

/* ======================= boot ======================= */
const agent = createAgent(document.getElementById("character"), "Show another agent");
const font = opentype.parse(b64ToBuf(FONT_B64));
const GREEN = "#04b84c";
const title = createDrawDots(document.getElementById("title"), font, {

});
window.__demo = { agent, title };
if (location.hash === "#debug") setTimeout(() => { const f = document.querySelector(".dd .fill"), c = getComputedStyle(f); document.title = JSON.stringify({ op: c.opacity, fill: c.fill, anim: c.animationName, color: getComputedStyle(document.querySelector(".dd")).color, rect: JSON.stringify(document.querySelector(".dd").getBoundingClientRect()) }); }, 8500);

/* optional test hooks for automated screenshots: #hover / #look=x,y */
(function () {
  const h = location.hash;
  if (h.startsWith("#hover")) setTimeout(() => title.enter(title.letters[+(h.split("=")[1] || 8)]), 3000);
  if (h.startsWith("#look=")) setTimeout(() => { const [x, y] = h.slice(6).split(",").map(Number); dispatchEvent(new PointerEvent("pointermove", { clientX: x, clientY: y, pointerType: "mouse" })); }, 3000);
})();
