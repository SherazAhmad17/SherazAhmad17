<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g transform="translate(20 8)">
  <polygon points="0,18 18,8 36,18 18,28" fill="#a994ff"/><polygon points="0,18 18,28 18,48 0,38" fill="#5a3de6"/><polygon points="36,18 18,28 18,48 36,38" fill="#3524a8"/>
