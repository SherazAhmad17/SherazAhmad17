<rect x="72" y="54" width="900" height="3" rx="1.5" fill="url(#g)"><animate attributeName="width" values="0;900" dur="1.6s" fill="freeze"/></rect>
<rect x="72" y="53" width="120" height="5" rx="2.5" fill="url(#sh)"><animate attributeName="x" values="72;860" dur="2.6s" repeatCount="indefinite"/></rect>
